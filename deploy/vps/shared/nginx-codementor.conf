# CodeMentor site for nginx — installed by deploy/vps/shared/install-shared.sh as
# /etc/nginx/sites-available/codementor.conf. Only this file belongs to CodeMentor; other sites on
# the server are never edited. certbot (--nginx) adds the HTTPS listener and redirect to this file.
# __DOMAIN__ and __PORT__ are filled in by the installer.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    # Never cache the password-reset pages anywhere.
    location /reset/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied values: the app trusts X-Real-IP for rate limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/codementor.access.log;
    error_log /var/log/nginx/codementor.error.log;
}
